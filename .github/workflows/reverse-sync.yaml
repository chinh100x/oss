name: sync-service-reverse
on:
  push:
    branches: [main]
    paths: ["plugin/**"]
jobs:
  reverse-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: chinh100x/sync-service@main
        with:
          config: |
            destination:
              repo: chinh100x/oss
              branch: main
            mappings:
              - key: portmon
                source: src/portmon
                dest: plugin
                break_check:
                  install: "true"
                  run: "python3 plugin/covenant.py"
          direction: reverse
          counterpart-repo: chinh100x/prod
          counterpart-branch: main
          counterpart-token: ${{ secrets.SYNC_SERVICE_PROD_TOKEN }}
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
